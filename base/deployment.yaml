apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock
  labels:
    app.kubernetes.io/name: bedrock
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bedrock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bedrock
    spec:
      containers:
        - name: bedrock
          image: itzg/minecraft-bedrock-server:latest
          imagePullPolicy: Always
          tty: true
          stdin: true
          env:
            - name: EULA
              value: "TRUE"
            - name: VERSION
              value: LATEST
            # BDS defaults to NetherNet (TCP + WebRTC UDP range). RakNet keeps one UDP port per
            # server, which the Traefik UDP entrypoints and BedrockConnect rely on.
            - name: TRANSPORT
              value: raknet
          ports:
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bedrock-data
