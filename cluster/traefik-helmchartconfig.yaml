# Extra Traefik entrypoints for Minecraft Bedrock servers.
# One UDP port per server; the name must be mc-<server> to match servers/<server>.
# Applying a change redeploys Traefik (brief HTTP ingress interruption).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      mc-daan:
        port: 19332
        exposedPort: 19332
        protocol: UDP
        expose:
          default: true
      mc-gaitie:
        port: 19132
        exposedPort: 19132
        protocol: UDP
        expose:
          default: true
      mc-kontgat:
        port: 19134
        exposedPort: 19134
        protocol: UDP
        expose:
          default: true
      mc-creative:
        port: 19232
        exposedPort: 19232
        protocol: UDP
        expose:
          default: true
      mc-plaskutje:
        port: 19140
        exposedPort: 19140
        protocol: UDP
        expose:
          default: true
