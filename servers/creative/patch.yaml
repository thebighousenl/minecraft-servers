apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock
spec:
  template:
    spec:
      containers:
        - name: bedrock
          env:
            - name: SERVER_NAME
              value: "BRDC MC Creative"
            - name: LEVEL_NAME
              value: Main
            - name: GAMEMODE
              value: creative
            # The old server had "peacefull" (typo), which Bedrock treated as easy.
            - name: DIFFICULTY
              value: easy
            - name: ALLOW_CHEATS
              value: "true"
            - name: MAX_PLAYERS
              value: "10"
            - name: ONLINE_MODE
              value: "true"
            - name: ALLOW_LIST_USERS
              value: DecidingTiara99:2535442332074978,PancakeNL8261:2533274926013414,BeastSqueez:2535444807168366,Gjdeterrorist:2533274863407504,NukePancakeLapt:2535457904060356
            - name: DEFAULT_PLAYER_PERMISSION_LEVEL
              value: operator
            - name: VIEW_DISTANCE
              value: "48"
